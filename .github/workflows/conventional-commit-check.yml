# PR titles end up as SDK commit subjects, which release-please reads to pick
# version bumps and write changelogs.
name: Conventional Commit Check

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  pr-title-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Titles must not contain ticket IDs, because they end up in the public changelog.
          # A ticket ID is two or more letters, a dash, and two or more digits, in any case.
          # CVE IDs are allowed.
          disallowScopes: '.*[A-Za-z]{2,}-[0-9]{2,}.*'
          subjectPattern: '^(?!.*(?<![A-Za-z])(?!CVE-)[A-Za-z]{2,}-[0-9]{2,}).+$'
          subjectPatternError: 'PR titles must not mention tickets, but "{subject}" contains a ticket ID. Link the ticket from the branch name or PR description instead.'
